<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#f5f5f5;font-family:Segoe UI,system-ui,-apple-system,sans-serif}
svg{display:block}
.node{fill:#ececec;stroke:#bfc0c0;stroke-width:1.2}
.node.core{fill:rgba(235,108,54,0.08);stroke:#eb6c36}
.t{fill:#2d3142;font-size:12px;font-weight:600}
.s{fill:#7a8399;font-size:9px;font-family:Consolas,'Courier New',monospace}
.eb{fill:#4f5d75;font-size:8px;letter-spacing:0.18em;font-weight:500;text-transform:uppercase;font-family:Consolas,'Courier New',monospace}
.zone{fill:rgba(45,49,66,0.04);stroke:rgba(45,49,66,0.12);stroke-dasharray:4,3}
.arrow{stroke:#4f5d75;stroke-width:1.2;fill:none}
.arrowhead{fill:#4f5d75}
</style></head><body>
<svg width="960" height="600" viewBox="0 0 960 600">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" class="arrowhead"/></marker></defs>

  <text x="28" y="30" class="eb">Architecture · V2</text>
  <text x="28" y="56" class="t" style="font-size:17px">V2 Collaboration Engine</text>
  <text x="28" y="73" class="s">python -m collab · company-mode CLI · self-contained</text>

  <rect class="zone" x="40" y="88" width="880" height="86" rx="8"/>
  <text x="52" y="106" class="eb">Entry</text>
  <rect class="zone" x="40" y="190" width="880" height="152" rx="8"/>
  <text x="52" y="208" class="eb">Engine</text>
  <rect class="zone" x="40" y="358" width="880" height="220" rx="8"/>
  <text x="52" y="376" class="eb">Governance · Support · Output</text>

  <!-- connectors (behind) -->
  <g class="arrow" marker-end="url(#ah)">
    <path d="M480,156 V190"/>
    <path d="M480,234 V272"/>
    <path d="M480,332 V370 H414 V392"/>
    <path d="M500,414 H570"/>
    <path d="M330,414 H270"/>
    <path d="M414,444 V470 H480 V500"/>
    <path d="M176,470 V500"/>
  </g>

  <!-- Entry -->
  <rect class="node" x="360" y="112" width="240" height="44" rx="8"/>
  <text x="392" y="139" class="t">python -m collab</text>

  <!-- Engine -->
  <rect class="node" x="360" y="196" width="240" height="44" rx="8"/>
  <text x="398" y="223" class="t">Runner + RunStore · SQLite</text>

  <!-- Core -->
  <rect class="node core" x="360" y="280" width="240" height="52" rx="8"/>
  <text x="374" y="303" class="t" style="fill:#b34d1f">LangGraph wave scheduler</text>
  <text x="374" y="319" class="s">core</text>

  <!-- Governance chain -->
  <rect class="node" x="90" y="392" width="180" height="44" rx="8"/>
  <text x="118" y="419" class="t">Task executor</text>
  <rect class="node" x="330" y="392" width="180" height="44" rx="8"/>
  <text x="364" y="419" class="t">L2 audit</text>
  <rect class="node" x="570" y="392" width="240" height="44" rx="8"/>
  <text x="592" y="419" class="t">Arbitration · rules → manager</text>

  <!-- Support row -->
  <rect class="node" x="90" y="470" width="160" height="40" rx="8"/>
  <text x="122" y="495" class="t">Memory</text>
  <rect class="node" x="300" y="470" width="150" height="40" rx="8"/>
  <text x="330" y="495" class="t">Motion</text>
  <rect class="node" x="500" y="470" width="170" height="40" rx="8"/>
  <text x="522" y="495" class="t">Costing</text>
  <rect class="node" x="720" y="470" width="150" height="40" rx="8"/>
  <text x="752" y="495" class="t">LLM auto→mock</text>

  <!-- Output -->
  <rect class="node" x="360" y="540" width="240" height="40" rx="8"/>
  <text x="384" y="565" class="t">report · status · cost</text>

</svg>
</body></html>
