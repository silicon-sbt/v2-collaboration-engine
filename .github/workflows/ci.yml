name: collab-ci

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch: {}
  push:
    branches: [master]

jobs:
  test:
    name: collab tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run collab tests with coverage
        run: python -m pytest tests/ -q --cov=collab --cov-report=xml --cov-report=term-missing
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          files: coverage.xml

  package:
    name: packaging smoke (the advertised install path actually runs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build sdist + wheel and validate metadata
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Install the wheel in a clean venv and run the CLI outside the checkout
        run: |
          python -m venv /tmp/pkgtest
          /tmp/pkgtest/bin/python -m pip install --upgrade pip
          /tmp/pkgtest/bin/python -m pip install dist/*.whl
          /tmp/pkgtest/bin/python -m pip check
          cd /tmp
          /tmp/pkgtest/bin/collab --version
          /tmp/pkgtest/bin/collab demo --mock
